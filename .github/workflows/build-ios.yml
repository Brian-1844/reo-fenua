# Reo Fenua pour iPhone : construit l'application iPhone à partir de BitChat iOS (domaine public).
# Résultat : reo-fenua-iphone.ipa dans une « pré-version » de l'onglet Releases.
# ATTENTION : ce fichier n'est pas signé par Apple. Pour l'installer sur un iPhone il faut
# soit un compte développeur Apple (TestFlight / App Store), soit un outil comme Sideloadly.

name: Construire Reo Fenua iPhone

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: iphone-v1.${{ github.run_number }}
    steps:
      - name: Récupérer BitChat iOS
        run: git clone --depth 1 https://github.com/permissionlesstech/bitchat.git upstream

      - name: Appliquer le style Reo Fenua
        working-directory: upstream
        run: |
          python3 - <<'PY'
          ICON = ''
          import pathlib, re, base64

          def warn(m):
              print("::warning::" + m)

          # 1. Nom affiché sous l'icône
          plist = pathlib.Path("bitchat/Info.plist")
          t = plist.read_text()
          n = re.sub(r"(<key>CFBundleDisplayName</key>\s*<string>)[^<]*(</string>)", r"\g<1>Reo Fenua\g<2>", t)
          if n == t:
              warn("Nom de l'application non modifié")
          plist.write_text(n)

          # 2. Couleurs du fenua et police lisible
          theme = pathlib.Path("bitchat/Utils/Theme.swift")
          t = theme.read_text()
          pairs = [
              ("let green = isDark ? Color.green : Color(red: 0, green: 0.5, blue: 0)",
               "let green = isDark ? Color(red: 0.31, green: 0.76, blue: 0.80) : Color(red: 0.043, green: 0.235, blue: 0.365)"),
              ("background: isDark ? Color.black : Color.white,",
               "background: isDark ? Color(red: 0.027, green: 0.118, blue: 0.18) : Color(red: 0.969, green: 0.937, blue: 0.886),"),
              ("            accent: green,",
               "            accent: Color(red: 0.055, green: 0.486, blue: 0.525),"),
              ("case .matrix: return .monospaced", "case .matrix: return .default"),
          ]
          for a, b in pairs:
              if t.count(a) == 1:
                  t = t.replace(a, b)
              else:
                  warn("Couleur non trouvée : " + a[:40])
          theme.write_text(t)

          # 3. Icône Reo Fenua
          icon = pathlib.Path("bitchat/Assets.xcassets/AppIcon.appiconset/icon_1024x1024.png")
          icon.write_bytes(base64.b64decode(ICON))
          print("Reo Fenua iPhone : nom, couleurs et icône appliqués.")
          PY

      - name: Construire l'application iPhone (sans signature)
        working-directory: upstream
        run: |
          set -o pipefail
          xcodebuild -project bitchat.xcodeproj \
            -scheme "bitchat (iOS)" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Préparer le fichier .ipa
        run: |
          APP=$(find upstream/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Application : $APP"
          mkdir -p sortie/Payload
          cp -R "$APP" sortie/Payload/
          cd sortie && zip -qry reo-fenua-iphone.ipa Payload && ls -la

      - name: Garder le fichier (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: reo-fenua-iphone
          path: sortie/reo-fenua-iphone.ipa

      - name: Publier en pré-version (ne gêne pas les mises à jour Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" sortie/reo-fenua-iphone.ipa \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Reo Fenua iPhone $TAG (test)" \
            --notes "Version iPhone de test, NON signée par Apple. Installation : avec Sideloadly (gratuit, depuis un ordinateur, à renouveler tous les 7 jours) ou plus tard via TestFlight avec un compte développeur Apple. Compatible avec Reo Fenua Android."
